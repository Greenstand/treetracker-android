# C4. Needs the org from `bash e2e/seed-org.sh -s <serial> wallet-select`.
# Two sessions: pick an existing wallet, then add a new one.
appId: org.greenstand.android.TreeTracker.debug
name: C4 Wallet select
tags: [org-config]
---
- launchApp
- runFlow:
    file: subflows/org-capture-setup.yaml
- assertVisible: {id: OrangeAddButton}
- tapOn: {id: "UserButton_5551230001"}
- tapOn: {id: ArrowForwardButton}
- extendedWaitUntil:
    visible: {id: CaptureButton}
    timeout: 30000
- tapOn: {id: CaptureButton}
- extendedWaitUntil:
    visible: {id: ApproveButton}
    timeout: 30000
- tapOn: {id: ApproveButton}
- extendedWaitUntil:
    visible: {id: CaptureButton}
    timeout: 15000
- tapOn: {id: ArrowBackButton}
- extendedWaitUntil:
    visible: {id: TrackButton}
    timeout: 15000
- assertVisible: {id: TreesToSyncCount, text: "3"}
# Second session: add a wallet by name.
- runFlow:
    file: subflows/org-capture-setup.yaml
- tapOn: {id: OrangeAddButton}
- tapOn: {id: WalletNameField}
- inputText: Tree Fund
- hideKeyboard
- tapOn: {id: ArrowForwardButton}
- extendedWaitUntil:
    visible: {id: CaptureButton}
    timeout: 30000
- tapOn: {id: CaptureButton}
- extendedWaitUntil:
    visible: {id: ApproveButton}
    timeout: 30000
- tapOn: {id: ApproveButton}
- extendedWaitUntil:
    visible: {id: CaptureButton}
    timeout: 15000
- tapOn: {id: ArrowBackButton}
- extendedWaitUntil:
    visible: {id: TrackButton}
    timeout: 15000
- assertVisible: {id: TreesToSyncCount, text: "4"}
