# Guards #1450: after adding a new user mid setup, signup opens Add org once the selfie is saved.
# A first tap on Next right as Add org appears must be handled, not taken for the second tap of
# a double tap (no tap navigated here: the camera result and a DB write did).
#
# Next is tapped at a point, not by id, so tb taps as soon as Add org is visible instead of
# waiting for a still screen first. Before the fix that tap was dropped and the app stayed on
# Add org.
appId: org.greenstand.android.TreeTracker.debug
name: B6b Quick Next after adding a user mid setup
tags: [capture]
---
- launchApp: {clearState: true}
- runFlow:
    file: subflows/signup.yaml
    env: {CREDENTIAL: Phone, IDENTIFIER: "5551230001", FIRST_NAME: Ada, LAST_NAME: Admin}
- tapOn: {id: TrackButton}
- tapOn: {id: OrangeAddButton}
- tapOn: {id: PrivacyPolicyCloseButton}
- tapOn: {id: PhoneCredentialButton}
- tapOn: {id: PhoneField}
- inputText: "5551230002"
- hideKeyboard
- tapOn: {id: ArrowForwardButton}
- tapOn: {id: FirstNameField}
- inputText: Bea
- tapOn: {id: LastNameField}
- inputText: Planter
- hideKeyboard
- tapOn: {id: ArrowForwardButton}
- tapOn: {id: CaptureButton}
- extendedWaitUntil:
    visible: {id: ApproveButton}
    timeout: 15000
- tapOn: {id: ApproveButton}
- extendedWaitUntil:
    visible: {id: OrgNameField}
    timeout: 15000
# Add org's Next (ArrowForwardButton, bottom right), tapped the moment Add org shows.
- tapOn: {point: "82%,89%"}
- runFlow:
    when: {visible: {id: TutorialDoneButton}}
    commands:
      - tapOn: {id: TutorialDoneButton}
- extendedWaitUntil:
    visible: {id: CaptureButton}
    timeout: 15000
