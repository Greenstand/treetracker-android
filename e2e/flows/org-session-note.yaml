# C1. Needs the org from `bash e2e/seed-org.sh -s <serial> session-note`.
appId: org.greenstand.android.TreeTracker.debug
name: C1 Session note setup step
tags: [org-config]
---
- launchApp
- runFlow:
    file: subflows/org-capture-setup.yaml
- assertVisible: {id: SessionNoteField}
- tapOn: {id: SessionNoteField}
- inputText: Planting day at the school
- assertVisible: {id: SessionNoteField, text: "Planting day at the school"}
- hideKeyboard
- tapOn: {id: ArrowForwardButton}
- runFlow:
    when: {visible: {id: TutorialDoneButton}}
    commands:
      - tapOn: {id: TutorialDoneButton}
- extendedWaitUntil:
    visible: {id: CaptureButton}
    timeout: 30000
- tapOn: {id: CaptureButton}
- extendedWaitUntil:
    visible: {id: ApproveButton}
    timeout: 30000
- tapOn: {id: ApproveButton}
- extendedWaitUntil:
    visible: {id: CaptureButton}
    timeout: 15000
- tapOn: {id: ArrowBackButton}
- extendedWaitUntil:
    visible: {id: TrackButton}
    timeout: 15000
- assertVisible: {id: TreesToSyncCount, text: "3"}
