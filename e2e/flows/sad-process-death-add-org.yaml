# H5: process death on Add org. The user is in capture setup (Track, pick a user, Next) when
# Android kills the app in the background (killApp, like `am kill`), and reopens it from recents
# (launchApp with stopApp: false keeps the saved state). Add org comes back without a crash, and
# Next starts the session for the picked user and opens capture.
#
# Guards #1418: Nav3 restored Add org, but the capture setup scope only lived in memory, so
# AddOrgViewModel's init threw "CaptureSetupScope not open" and the app crashed on reopen. The
# setup is now saved as it is entered and restored before the back stack is shown.
appId: org.greenstand.android.TreeTracker.debug
name: H5 Process death on Add org
tags: [sad-path]
---
- launchApp: {clearState: true}
- runFlow:
    file: subflows/signup.yaml
    env: {CREDENTIAL: Phone, IDENTIFIER: "5551230001", FIRST_NAME: Ada, LAST_NAME: Admin}
- tapOn: {id: TrackButton}
- extendedWaitUntil:
    visible: {id: "UserButton_5551230001"}
    timeout: 15000
- tapOn: {id: "UserButton_5551230001"}
- tapOn: {id: ArrowForwardButton}
- extendedWaitUntil:
    visible: {id: OrgNameField}
    timeout: 15000
- pressKey: Home
- killApp
- launchApp: {stopApp: false}
# Before the fix the app crashed here, so Add org never showed.
- extendedWaitUntil:
    visible: {id: OrgNameField}
    timeout: 15000
- tapOn: {id: ArrowForwardButton}
- runFlow:
    when: {visible: {id: TutorialDoneButton}}
    commands:
      - tapOn: {id: TutorialDoneButton}
- extendedWaitUntil:
    visible: {id: CaptureButton}
    timeout: 30000
- assertNotVisible: {id: OrgNameField}
