# E8: delete the admin. Confirming shows the "Account Deleted" dialog, and closing it opens Signup as
# the only screen: back from it exits the app. After a relaunch there is no admin, so the app
# starts over on the language picker, as on a fresh install.
#
# The run is offline, so the request to the admin cannot be uploaded. That used to crash the app
# (#1416); the request now stays queued for the next sync.
appId: org.greenstand.android.TreeTracker.debug
name: E8 Delete admin
tags: [settings]
---
- launchApp: {clearState: true}
- runFlow:
    file: subflows/signup.yaml
    env: {CREDENTIAL: Phone, IDENTIFIER: "5551230001", FIRST_NAME: Ada, LAST_NAME: Admin}
- tapOn: {id: SettingsButton}
- tapOn: {id: SettingsDeleteAccount}
- tapOn: {id: "UserButton_5551230001"}
- tapOn: {id: ArrowForwardButton}
- assertVisible: {id: DialogUserButton}
- tapOn: {id: DialogPositiveButton}
- assertVisible: {id: DialogTitle, text: "Account Deleted"}
- tapOn: {id: DialogPositiveButton}
# Signup opens with the privacy policy dialog over the credential step.
- tapOn: {id: PrivacyPolicyCloseButton}
- assertVisible: {id: PhoneField}
- assertNotVisible: {id: SettingsDeleteAccount}
# Signup is the only screen, so back exits the app.
- back
- assertNotVisible: {id: PhoneField}
- assertNotVisible: {id: SettingsDeleteAccount}
- assertNotVisible: {id: TrackButton}
- stopApp
- launchApp
- extendedWaitUntil:
    visible: {id: LanguageOption_ENGLISH}
    timeout: 30000
- assertNotVisible: {id: TrackButton}
