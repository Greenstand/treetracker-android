# Logout lasts until someone signs in again. Closing and reopening the app after a logout opens
# Signup, not the Dashboard and not first-time setup, because logout keeps the power user and
# remembers that the app is logged out. Signing back in reaches the Dashboard.
appId: org.greenstand.android.TreeTracker.debug
name: Logout survives a relaunch
tags: [settings]
---
- launchApp: {clearState: true}
- runFlow:
    file: subflows/signup.yaml
    env: {CREDENTIAL: Phone, IDENTIFIER: "5551230001", FIRST_NAME: Ada, LAST_NAME: Admin}
- tapOn: {id: SettingsButton}
- tapOn: {id: SettingsLogout}
- tapOn: {id: DialogPositiveButton}
- assertVisible: {id: PrivacyPolicyCloseButton}
- pressKey: Home
- killApp
- launchApp: {stopApp: false}
# Signup, with no language picker first.
- extendedWaitUntil:
    visible: {id: PrivacyPolicyCloseButton}
    timeout: 30000
- assertNotVisible: {id: LanguageOption_ENGLISH}
- assertNotVisible: {id: TrackButton}
- tapOn: {id: PrivacyPolicyCloseButton}
- tapOn: {id: PhoneField}
- inputText: "5551230001"
- hideKeyboard
- tapOn: {id: ArrowForwardButton}
- tapOn: {id: ExistingUserButton}
- extendedWaitUntil:
    visible: {id: TrackButton}
    timeout: 15000
# Signed in again: a relaunch now opens the Dashboard.
- pressKey: Home
- killApp
- launchApp: {stopApp: false}
- extendedWaitUntil:
    visible: {id: TrackButton}
    timeout: 30000
