# E7: delete a non-admin user. Cancel keeps the user. Confirming removes them: after a relaunch
# the Delete account list only has the admin.
#
# KNOWN BUG: confirming a delete while the device is offline crashes the app. The user is deleted
# locally, then UserSelectViewModel.deleteUser (UserSelectViewModel.kt:128-139) calls
# messageRepo.syncMessages(), whose messageUploader.uploadMessages() (MessagesRepo.kt:158) is
# outside the try/catch and throws an AmazonClientException on the main-immediate scope. Because of
# it the "Account Deleted" dialog and the return to Settings cannot be checked here. stopApp and
# launchApp make the flow the same whether the app crashed or stayed up. Once fixed, assert the
# DialogTitle, tap DialogPositiveButton and assert SettingsDeleteAccount before the relaunch.
appId: org.greenstand.android.TreeTracker.debug
name: E7 Delete non-admin user
tags: [settings]
---
- launchApp: {clearState: true}
- runFlow:
    file: subflows/signup.yaml
    env: {CREDENTIAL: Phone, IDENTIFIER: "5551230001", FIRST_NAME: Ada, LAST_NAME: Admin}
# Add a second user, Bob, who is not the admin.
- tapOn: {id: TrackButton}
- tapOn: {id: OrangeAddButton}
- tapOn: {id: PrivacyPolicyCloseButton}
- tapOn: {id: PhoneField}
- inputText: "5551230002"
- hideKeyboard
- tapOn: {id: ArrowForwardButton}
- tapOn: {id: FirstNameField}
- inputText: Bob
- tapOn: {id: LastNameField}
- inputText: Builder
- hideKeyboard
- tapOn: {id: ArrowForwardButton}
- tapOn: {id: CaptureButton}
- tapOn: {id: ApproveButton}
- extendedWaitUntil:
    visible: {id: OrgNameField}
    timeout: 15000
- back
- back
- extendedWaitUntil:
    visible: {id: SettingsButton}
    timeout: 15000
- tapOn: {id: SettingsButton}
- tapOn: {id: SettingsDeleteAccount}
- assertVisible: {id: "UserButton_5551230001"}
- assertVisible: {id: "UserButton_5551230002"}
# Cancel keeps Bob.
- tapOn: {id: "UserButton_5551230002"}
- tapOn: {id: ArrowForwardButton}
- assertVisible: {id: DialogUserButton}
- tapOn: {id: DialogNegativeButton}
- assertNotVisible: {id: DialogTitle}
- assertVisible: {id: "UserButton_5551230002"}
# Confirm deletes Bob.
- tapOn: {id: ArrowForwardButton}
- tapOn: {id: DialogPositiveButton}
- stopApp
- launchApp
- extendedWaitUntil:
    visible: {id: TrackButton}
    timeout: 30000
- tapOn: {id: SettingsButton}
- tapOn: {id: SettingsDeleteAccount}
- assertVisible: {id: "UserButton_5551230001"}
- assertNotVisible: {id: "UserButton_5551230002"}
