# H1: location denied at first launch. A fresh install asks for its permissions on the splash
# screen; the user allows everything but location. The app should leave the splash screen (or
# explain that location is needed) instead of waiting forever.
#
# Known bug: SplashScreen only moves on when both location permissions are granted
# (splash/SplashScreen.kt, the RequestMultiplePermissions onResult), so a denial leaves the app
# on the splash image with no message. This flow asserts the expected behaviour and fails today.
appId: org.greenstand.android.TreeTracker.debug
name: H1 Location denied at first launch
tags: [sad-path, known-bug]
---
- launchApp:
    clearState: true
    permissions: {camera: allow, notifications: allow, location: deny}
# Location is left unanswered, so Android asks for it: deny it in the system dialog.
- extendedWaitUntil:
    visible: {id: permission_deny_button}
    timeout: 15000
- tapOn: {id: permission_deny_button}
# Physical activity is asked for next; allow it.
- runFlow:
    when: {visible: {id: permission_allow_button}}
    commands:
      - tapOn: {id: permission_allow_button}
- extendedWaitUntil:
    notVisible: {id: SplashScreen}
    timeout: 15000
