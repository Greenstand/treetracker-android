# Robolectric defaults for every unit test.
# A plain Application stops Robolectric from starting TreeTrackerApplication (and Koin)
# now that unit tests run with Android resources.
application=android.app.Application
# One SDK for every test, so they share a single Robolectric sandbox (each SDK loads its own
# android-all into memory). API 37 is exercised separately with an emulator.
sdk=35
