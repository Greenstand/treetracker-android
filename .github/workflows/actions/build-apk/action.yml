name: 'Build APK'
description: 'Build APK for specified variant (assumes environment already set up)'

inputs:
  build_variant:
    description: 'Build variant (dev, debug, beta, prerelease, release)'
    required: true
  decode_keystore:
    description: 'Whether to decode keystore for signing'
    required: false
    default: 'false'
outputs:
  version_code:
    description: 'The version code the APK was built with'
    value: ${{ steps.version.outputs.version_code }}

runs:
  using: 'composite'
  steps:
    - name: Validate production and release signing secrets
      if: inputs.decode_keystore == 'true'
      shell: bash
      run: |
        missing=()
        [ -n "${S3_PRODUCTION_IDENTITY_POOL_ID}" ] || missing+=("S3_PRODUCTION_IDENTITY_POOL_ID")
        [ -n "${PROD_TREETRACKER_CLIENT_ID}" ] || missing+=("PROD_TREETRACKER_CLIENT_ID")
        [ -n "${PROD_TREETRACKER_CLIENT_SECRET}" ] || missing+=("PROD_TREETRACKER_CLIENT_SECRET")
        [ -n "${KEYSTORE_FILE}" ] || missing+=("KEYSTORE_FILE")
        [ -n "${KEYSTORE_PASSWORD}" ] || missing+=("KEYSTORE_PASSWORD")
        [ -n "${KEY_ALIAS}" ] || missing+=("KEY_ALIAS")
        [ -n "${KEY_PASSWORD}" ] || missing+=("KEY_PASSWORD")
        if [ ${#missing[@]} -gt 0 ]; then
          echo "Missing required production release secrets: ${missing[*]}"
          exit 1
        fi

    - name: Decode keystore (for release builds)
      if: inputs.decode_keystore == 'true'
      shell: bash
      run: echo "${KEYSTORE_FILE}" | base64 --decode > keystore.jks

    - name: Make gradlew executable
      shell: bash
      run: chmod +x ./gradlew

    # Version code: baseVersionCode from app/build.gradle, plus this workflow's run number for
    # every variant except release. Nothing is committed (master only accepts PRs), so the
    # number exists only in this build. Release builds keep the committed number.
    - name: Compute version code
      id: version
      shell: bash
      run: |
        BASE=$(grep -oP 'def baseVersionCode = \K\d+' app/build.gradle)
        if [ -z "$BASE" ]; then
          echo "Couldn't find 'def baseVersionCode = <number>' in app/build.gradle." >&2
          exit 1
        fi
        if [ "${{ inputs.build_variant }}" = "release" ]; then OFFSET=0; else OFFSET=${{ github.run_number }}; fi
        echo "offset=$OFFSET" >> "$GITHUB_OUTPUT"
        echo "version_code=$((BASE + OFFSET))" >> "$GITHUB_OUTPUT"
        echo "Version code: $((BASE + OFFSET)) (base $BASE + run number offset $OFFSET)"

    - name: Build APK
      shell: bash
      run: |
        VARIANT=$(echo "${{ inputs.build_variant }}" | sed 's/\b\(.\)/\u\1/')
        ./gradlew clean assemble${VARIANT} -Ptreetracker.versionCodeOffset=${{ steps.version.outputs.offset }}
