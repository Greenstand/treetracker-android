name: TEMP record debug

# TEMPORARY, on a debug PR only (never merged): reproduces tb --record losing its video.
on:
  pull_request:
    paths: [ ".github/workflows/tmp-record-debug.yml", "e2e/ci/tmp-record-debug.sh" ]

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_LEVEL: "35"
      TESTBUDDY_REF: 447f360efb307b348925825c434b1e4cf3271ebb
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: tb cache
        id: tb-cache
        uses: actions/cache/restore@v4
        with:
          path: bin/tb
          key: tb-${{ env.TESTBUDDY_REF }}-linux-x64
      - name: Check out Test Buddy
        if: steps.tb-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: Elforama/testbuddy
          ref: ${{ env.TESTBUDDY_REF }}
          path: .testbuddy
          persist-credentials: false
      - if: steps.tb-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - if: steps.tb-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: .testbuddy/go.mod
          cache: false
      - name: Build tb
        if: steps.tb-cache.outputs.cache-hit != 'true'
        working-directory: .testbuddy
        run: |
          (cd agents/android && ./gradlew assembleDebug)
          cp agents/android/app/build/outputs/apk/debug/app-debug.apk internal/driver/android/assets/tb-agent.apk
          go build -o "$GITHUB_WORKSPACE/bin/tb" ./cmd/tb
      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: gradle
      - name: Dummy property file
        run: |
          cat > treetracker.keys.properties <<'KEYS'
          treetracker_client_id=dummy-id
          treetracker_client_secret=dummy-secret
          s3_dev_identity_pool_id=dummy-pool-id-dev
          s3_test_identity_pool_id=dummy-pool-id-test
          prod_treetracker_client_id=dummy-prod-id
          prod_treetracker_client_secret=dummy-prod-secret
          s3_production_identity_pool_id=dummy-pool-id-prod
          KEYS
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Emulator snapshot cache
        uses: actions/cache/restore@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64-cameras
      - name: Build the debug app
        run: bash ./gradlew :app:assembleDebug --stacktrace
      - name: Experiments
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            TB="$GITHUB_WORKSPACE/bin/tb" bash e2e/ci/tmp-record-debug.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: record-debug
          path: build/dbg/
          retention-days: 3
