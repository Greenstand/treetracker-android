name: Deploy to Firebase Beta

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name to build and deploy from"
        required: true
        type: string
        default: master
      build_type:
        description: "Build to deploy"
        required: true
        type: choice
        options:
          - beta
          - dev
        default: beta
      group:
        description: "Tester group to deploy to"
        required: true
        type: choice
        options:
          - Greenstand
          - dev
          - debug
        default: Greenstand
      release_notes:
        description: "Release Notes"
        required: true
        type: string

jobs:
  build:
    name: Build ${{ inputs.build_type }} APK
    uses: ./.github/workflows/build.yml
    with:
      build_variant: ${{ inputs.build_type }}
      source_ref: ${{ inputs.branch }}
      upload_artifact: true
    secrets: inherit

  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-${{ inputs.build_type }}

      - name: Resolve APK path
        id: resolve-apk
        shell: bash
        run: |
          APK_FILE=$(find . -maxdepth 3 -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "No APK found after artifact download."
            find . -maxdepth 4 -type f
            exit 1
          fi
          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"
          echo "Using APK: $APK_FILE"

      - name: Validate Firebase service account secret
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not set. Add the Firebase service account JSON in repository secrets."
            exit 1
          fi

      # Each build type is its own Firebase app, because each has its own application id
      # (see app/google-services.json): beta is ...TreeTracker.test, dev is ...TreeTracker.dev.
      - name: Resolve Firebase app id
        id: firebase-app
        shell: bash
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          case "$BUILD_TYPE" in
            beta) APP_ID="1:422699885542:android:aab16ef8fc4e5968a0ec27" ;;
            dev)  APP_ID="1:422699885542:android:0d0fe64a4522d006a0ec27" ;;
            *)
              echo "No Firebase app id is configured for build type '$BUILD_TYPE'."
              exit 1
              ;;
          esac
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "Deploying the $BUILD_TYPE build to Firebase app $APP_ID"

      - name: Deploy to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ steps.firebase-app.outputs.app_id }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ inputs.group }}
          releaseNotes: ${{ github.event.inputs.release_notes }}
          file: ${{ steps.resolve-apk.outputs.apk_file }}

