name: Android end-to-end

on:
  pull_request:
    branches: [ master, release* ]
  workflow_dispatch:

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

# Runs the Test Buddy flows in e2e/flows on an Android emulator against the debug app. A failed
# step in a flow (an element that never shows up, a tap that finds nothing) makes tb exit
# non-zero, which fails this check.
jobs:
  android-e2e:
    name: emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_LEVEL: "35"
      # The Test Buddy commit tb is built from. Bump it to pick up a newer tb.
      TESTBUDDY_REF: 6c7a54affd233711d5921c310f0c9acee3141dc9
    steps:
      - uses: actions/checkout@v4

      - name: Check out Test Buddy
        uses: actions/checkout@v4
        with:
          repository: Elforama/testbuddy
          ref: ${{ env.TESTBUDDY_REF }}
          path: .testbuddy

      # Test Buddy's Android agent builds with JDK 21; the app below uses JDK 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@v5
        with:
          go-version-file: .testbuddy/go.mod
          cache-dependency-path: .testbuddy/go.sum
      - name: Build tb
        working-directory: .testbuddy
        run: |
          (cd agents/android && ./gradlew assembleDebug)
          cp agents/android/app/build/outputs/apk/debug/app-debug.apk internal/driver/android/assets/tb-agent.apk
          go build -o "$GITHUB_WORKSPACE/bin/tb" ./cmd/tb

      - name: Setup build environment
        uses: ./.github/workflows/actions/setup-build-environment
        with:
          use_dummy_keys: true
      - name: Build the debug app
        run: bash ./gradlew :app:assembleDebug --stacktrace

      # The emulator needs hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A booted emulator snapshot, saved once, so later runs skip the cold boot.
      - name: Emulator snapshot cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64-cameras

      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          script: echo "snapshot saved"

      - name: Run the e2e flows on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            TB="$GITHUB_WORKSPACE/bin/tb" bash e2e/run.sh -s "$(adb get-serialno)"

      - name: Test report and debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e
          path: build/e2e/
          if-no-files-found: ignore
          retention-days: 14

      - name: Delete dummy property file
        if: always()
        run: rm -f treetracker.keys.properties
