name: E2E before/after videos

# Records a video of the e2e flows a PR adds or changes, run against master's app ("before") and
# against this branch's app ("after"). Both runs use this branch's flow files, so a bug fix PR
# that drops the known-bug tag from its flow gets a video of the flow failing on master and
# passing with the fix. Videos and results are uploaded as the e2e-video-before and
# e2e-video-after artifacts and listed in the run summary. The runs never fail this check: the
# "Android end-to-end" check is the one that gates the PR.
#
# A PR that only changes this recorder records every known-bug flow, as a test of the recorder.
# Run it by hand (Actions > E2E before/after videos > Run workflow) to record any flows.
on:
  pull_request:
    branches: [ master, release* ]
    paths:
      - "e2e/flows/**"
      - "e2e/record.sh"
      - ".github/workflows/e2e-video.yml"
  workflow_dispatch:
    inputs:
      flows:
        description: "Flow files to record, space separated (e.g. e2e/flows/sad-back-add-org.yaml)"
        required: true
      base:
        description: "Ref whose app is the 'before'"
        required: false
        default: master

concurrency:
  group: e2e-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pick-flows:
    name: pick flows
    runs-on: ubuntu-latest
    outputs:
      flows: ${{ steps.pick.outputs.flows }}
      base: ${{ steps.pick.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT_FLOWS: ${{ inputs.flows }}
          INPUT_BASE: ${{ inputs.base }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ $EVENT == workflow_dispatch ]]; then
            BASE=$(git rev-parse "origin/${INPUT_BASE#origin/}")
            FLOWS=$INPUT_FLOWS
          else
            BASE=$(git merge-base "$PR_BASE" HEAD)
            FLOWS=$(git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'e2e/flows/*.yaml' | { grep -v '^e2e/flows/subflows/' || true; } | tr '\n' ' ')
            if [[ -z ${FLOWS// } ]]; then
              FLOWS=$(grep -l -E '^tags:.*known-bug' e2e/flows/*.yaml | tr '\n' ' ')
            fi
          fi
          for F in $FLOWS; do [[ -f $F ]] || { echo "::error::No flow file $F"; exit 1; }; done
          echo "Recording: $FLOWS (before = $BASE)"
          echo "flows=$FLOWS" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

  record:
    name: record (${{ matrix.app }})
    needs: pick-flows
    if: needs.pick-flows.outputs.flows != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [ before, after ]
    env:
      API_LEVEL: "35"
      # Keep in step with android-e2e.yml.
      TESTBUDDY_REF: ab598c27daa9784f026229c9322adba69b11f8b5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The "before" app is the base's code; the flows and scripts stay this branch's.
      - name: Use the base's app code
        if: matrix.app == 'before'
        env:
          BASE: ${{ needs.pick-flows.outputs.base }}
        run: |
          git restore --source="$BASE" --staged --worktree -- . ':(exclude)e2e' ':(exclude).github'
          git status --short | head -20

      - name: Check out Test Buddy
        uses: actions/checkout@v4
        with:
          repository: Elforama/testbuddy
          ref: ${{ env.TESTBUDDY_REF }}
          path: .testbuddy
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@v5
        with:
          go-version-file: .testbuddy/go.mod
          cache-dependency-path: .testbuddy/go.sum
      - name: Build tb
        working-directory: .testbuddy
        run: |
          (cd agents/android && ./gradlew assembleDebug)
          cp agents/android/app/build/outputs/apk/debug/app-debug.apk internal/driver/android/assets/tb-agent.apk
          go build -o "$GITHUB_WORKSPACE/bin/tb" ./cmd/tb

      - name: Setup build environment
        uses: ./.github/workflows/actions/setup-build-environment
        with:
          use_dummy_keys: true
      - name: Build the debug app
        run: bash ./gradlew :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Same snapshot as android-e2e.yml (same key), so either workflow can save it.
      - name: Emulator snapshot cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64-cameras
      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          script: echo "snapshot saved"

      - name: Record the flows
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FLOWS: ${{ needs.pick-flows.outputs.flows }}
          OUT: build/e2e-video
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            TB="$GITHUB_WORKSPACE/bin/tb" bash e2e/record.sh -s "$(adb get-serialno)" $FLOWS

      - name: Summary
        if: always()
        env:
          APP: ${{ matrix.app }}
          BASE: ${{ needs.pick-flows.outputs.base }}
        run: |
          {
            if [[ $APP == before ]]; then echo "### Before: app at ${BASE:0:10}"; else echo "### After: app at ${GITHUB_SHA:0:10}"; fi
            echo
            echo "| Flow | Result |"
            echo "|---|---|"
            if [[ -f build/e2e-video/results.txt ]]; then
              while read -r NAME RESULT; do echo "| \`$NAME\` | $RESULT |"; done < build/e2e-video/results.txt
            fi
            echo
            echo "Videos: the \`e2e-video-$APP\` artifact of this run."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-video-${{ matrix.app }}
          path: build/e2e-video/
          if-no-files-found: ignore
          retention-days: 30
      - name: Delete dummy property file
        if: always()
        run: rm -f treetracker.keys.properties
